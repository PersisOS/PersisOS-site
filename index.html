<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PersisOS</title>
    <link rel="icon" href="./persisos.svg">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            font-family: Inter, Segoe UI, Arial, sans-serif;
            color: white;
        }

        body {
            background:
                radial-gradient(circle at top, #5a3383 0%, #12151b 35%, #090a0d 100%);
            display: flex;
            justify-content: center;
            align-items: center;
        }


        /* Main */

        .container {
            position: relative;
            z-index: 2;
            width: min(950px, 92%);
            text-align: center;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #b8c0cf;
            font-size: 1.15rem;
            margin-bottom: 40px;
        }

        .slider {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;

            border-radius: 18px;
            overflow: hidden;

            background: #111;

            border: 1px solid rgba(255, 255, 255, .08);

            box-shadow:
                0 15px 60px rgba(0, 0, 0, .45);

            backdrop-filter: blur(10px);
        }

        .slide {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;

            opacity: 0;
            transition: opacity 1s ease;
        }

        .slide.active {
            opacity: 1;
        }

        .dots {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 18px;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #555;
            transition: .3s;
        }

        .dot.active {
            background: #4f8cff;
            transform: scale(1.2);
        }

        .buttons {
            margin-top: 40px;
        }

        .button {
            display: inline-block;

            padding: 15px 34px;

            border-radius: 12px;

            background: #2563eb;

            color: white;

            text-decoration: none;

            font-weight: 600;

            transition: .25s;

            box-shadow: 0 10px 30px rgba(37, 99, 235, .3);
        }

        .button:hover {
            transform: translateY(-3px);
            background: #3b82f6;
        }

        footer {
            margin-top: 40px;
            color: #80889b;
            font-size: .95rem;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: none;
            }
        }

        @media(max-width:700px) {

            .logo {
                width: 110px;
            }

            h1 {
                font-size: 2rem;
            }

            .subtitle {
                font-size: 1rem;
            }

            .button {
                width: 100%;
            }
        }
    </style>

</head>

<body>

    <div class="container">

        <img width="20%" class="logo" src="./persisos.svg" alt="PersisOS">

        <h1>PersisOS</h1>

        <div class="subtitle">
            Modern. Elegant. Open Source.
            <br><br>
            Coming Soon
        </div>

        <div class="slider">
            <img class="slide active" src="desktop1.png">
            <img class="slide" src="desktop2.png">
            <img class="slide" src="desktop3.png">
        </div>

        <div class="dots">
            <div class="dot active"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>

        <div class="buttons">
            <a class="button" href="https://github.com/arshavirm/PersisOS">
                View on GitHub
            </a>
        </div>

        <footer>
            2026 PersisOS - Debian Based - Open Source
        </footer>

    </div>

    <script>

        const slides = document.querySelectorAll(".slide");
        const dots = document.querySelectorAll(".dot");

        let current = 0;

        function showSlide(index) {

            slides.forEach(s => s.classList.remove("active"));
            dots.forEach(d => d.classList.remove("active"));

            slides[index].classList.add("active");
            dots[index].classList.add("active");
        }

        setInterval(() => {

            current++;

            if (current >= slides.length)
                current = 0;

            showSlide(current);

        }, 4500);

    </script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PersisOS — Coming Soon</title>
    <meta name="description" content="PersisOS is a Debian-based, open source Linux desktop. Coming soon.">
    <link rel="icon" href="./persisos.svg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --bg-0: #07080b;
            --bg-1: #0e1015;
            --bg-2: #15181f;
            --panel-border: rgba(255, 255, 255, .09);
            --violet: #8b7bff;
            --violet-dim: #4c3f99;
            --green: #7ee787;
            --text-0: #f3f4f8;
            --text-1: #a7aebd;
            --text-2: #656d80;
            --mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
            --sans: 'Inter', 'Segoe UI', Arial, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            font-family: var(--sans);
            color: var(--text-0);
            background:
                radial-gradient(ellipse 900px 500px at 50% -10%, rgba(139, 123, 255, .16), transparent 60%),
                radial-gradient(circle, rgba(255, 255, 255, .045) 1px, transparent 1px) 0 0/24px 24px,
                var(--bg-0);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        a {
            color: inherit;
        }

        button {
            font-family: inherit;
        }

        /* Top chrome bar — mimics a desktop titlebar */

        .chrome-bar {
            position: sticky;
            top: 0;
            z-index: 10;
            width: 100%;
            height: 46px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            background: rgba(14, 16, 21, .72);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--panel-border);
            font-family: var(--mono);
            font-size: .78rem;
            color: var(--text-2);
        }

        .chrome-lights {
            display: flex;
            gap: 7px;
        }

        .chrome-lights span {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: block;
        }

        .chrome-lights span:nth-child(1) {
            background: #ff5f57;
        }

        .chrome-lights span:nth-child(2) {
            background: #febc2e;
        }

        .chrome-lights span:nth-child(3) {
            background: #28c840;
        }

        .chrome-title {
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: .02em;
        }

        .chrome-title strong {
            color: var(--text-1);
            font-weight: 500;
        }

        .chrome-clock {
            font-variant-numeric: tabular-nums;
        }

        /* Main */

        main {
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .container {
            width: min(880px, 92%);
            padding: 72px 0 56px;
            text-align: center;
        }

        .eyebrow {
            font-family: var(--mono);
            font-size: .72rem;
            letter-spacing: .18em;
            text-transform: uppercase;
            color: var(--text-2);
            margin-bottom: 22px;
        }

        .eyebrow .dot-sep {
            color: var(--violet);
            margin: 0 8px;
        }

        h1 {
            font-family: var(--mono);
            font-weight: 700;
            font-size: clamp(2.5rem, 5vw + 1rem, 4.25rem);
            letter-spacing: -.02em;
            margin-bottom: 20px;
        }

        h1 .cursor {
            display: inline-block;
            width: .5em;
            background: var(--violet);
            margin-left: 4px;
            animation: blink 1.1s steps(1) infinite;
        }

        .subtitle {
            color: var(--text-1);
            font-size: 1.1rem;
            line-height: 1.6;
            max-width: 46ch;
            margin: 0 auto 30px;
        }

        .terminal-line {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-family: var(--mono);
            font-size: .92rem;
            color: var(--green);
            background: var(--bg-1);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            padding: 10px 16px;
            margin-bottom: 46px;
        }

        .terminal-line .prompt {
            color: var(--text-2);
        }

        .terminal-line .typed::after {
            content: '';
            display: inline-block;
            width: 8px;
            height: 1em;
            margin-left: 2px;
            background: var(--green);
            vertical-align: -2px;
            animation: blink 1.1s steps(1) infinite;
        }

        @keyframes blink {

            0%,
            49% {
                opacity: 1;
            }

            50%,
            100% {
                opacity: 0;
            }
        }

        /* Window / screenshot viewer */

        .window {
            position: relative;
            width: 100%;
            border-radius: 14px;
            overflow: hidden;
            background: var(--bg-1);
            border: 1px solid var(--panel-border);
            box-shadow: 0 30px 80px rgba(0, 0, 0, .5);
            text-align: left;
        }

        .window-titlebar {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 10px 14px;
            background: var(--bg-2);
            border-bottom: 1px solid var(--panel-border);
        }

        .window-titlebar .chrome-lights span {
            width: 9px;
            height: 9px;
        }

        .window-filename {
            font-family: var(--mono);
            font-size: .76rem;
            color: var(--text-2);
            flex: 1;
            text-align: center;
        }

        .window-counter {
            font-family: var(--mono);
            font-size: .72rem;
            color: var(--text-2);
        }

        .slider {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            background: #0a0a0d;
        }

        .slide {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity .8s ease;
        }

        .slide.active {
            opacity: 1;
        }

        .window-footer {
            display: flex;
            justify-content: center;
            gap: 8px;
            padding: 14px;
            background: var(--bg-2);
            border-top: 1px solid var(--panel-border);
        }

        .seg-dot {
            width: 22px;
            height: 4px;
            border-radius: 2px;
            border: none;
            background: rgba(255, 255, 255, .15);
            cursor: pointer;
            transition: background .25s;
        }

        .seg-dot.active {
            background: var(--violet);
        }

        .seg-dot:focus-visible,
        .button:focus-visible {
            outline: 2px solid var(--violet);
            outline-offset: 2px;
        }

        /* CTA */

        .buttons {
            margin-top: 44px;
        }

        .button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 14px 30px;
            border-radius: 10px;
            background: var(--violet);
            color: #0c0a17;
            text-decoration: none;
            font-weight: 600;
            font-size: .95rem;
            transition: transform .2s, background .2s;
        }

        .button:hover {
            transform: translateY(-2px);
            background: #9d8fff;
        }

        /* Footer dock */

        footer {
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 40px 0 56px;
        }

        .dock {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }

        .dock-item {
            font-family: var(--mono);
            font-size: .76rem;
            color: var(--text-2);
            border: 1px solid var(--panel-border);
            background: var(--bg-1);
            border-radius: 999px;
            padding: 7px 14px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .dock-item.link:hover {
            color: var(--text-0);
            border-color: var(--violet-dim);
        }

        @media (max-width: 700px) {
            .chrome-clock {
                display: none;
            }

            h1 {
                font-size: 2.4rem;
            }

            .subtitle {
                font-size: 1rem;
            }

            .button {
                width: 100%;
                justify-content: center;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            .cursor,
            .terminal-line .typed::after {
                animation: none;
                opacity: 1;
            }

            .slide,
            .button {
                transition: none;
            }
        }
    </style>

</head>

<body>

    <div class="chrome-bar">
        <div class="chrome-title">
            <span class="chrome-lights"><span></span><span></span><span></span></span>
            <strong>persisos</strong> — coming soon
        </div>
        <div class="chrome-clock" id="clock">00:00:00</div>
    </div>

    <main>
        <div class="container">

            <div class="eyebrow">Debian-based <span class="dot-sep">·</span> Open Source <span class="dot-sep">·</span>
                In Development</div>

            <h1>PersisOS<span class="cursor" aria-hidden="true">&nbsp;</span></h1>

            <p class="subtitle">
                A Linux desktop built for people who like to see how things work.
                No bloat, no lock-in — just a system you can actually read.
            </p>

            <div class="window">
                <div class="window-titlebar">
                    <span class="chrome-lights"><span></span><span></span><span></span></span>
                    <span class="window-counter" id="windowCounter">1 / 3</span>
                </div>
                <div class="slider">
                    <img class="slide active" src="desktop1.png" alt="PersisOS desktop preview 1">
                    <img class="slide" src="desktop2.png" alt="PersisOS desktop preview 2">
                    <img class="slide" src="desktop3.png" alt="PersisOS desktop preview 3">
                </div>
                <div class="window-footer" role="tablist" aria-label="Screenshot selector">
                    <button class="seg-dot active" aria-label="Show screenshot 1" aria-pressed="true"></button>
                    <button class="seg-dot" aria-label="Show screenshot 2" aria-pressed="false"></button>
                    <button class="seg-dot" aria-label="Show screenshot 3" aria-pressed="false"></button>
                </div>
            </div>

            <div class="buttons">
                <a class="button" href="https://github.com/arshavirm/PersisOS">
                    View source on GitHub ↗
                </a>
            </div>

        </div>
    </main>

    <footer>
        <div class="dock">
            <a class="dock-item link" href="https://github.com/arshavirm/PersisOS">GitHub</a>
            <span class="dock-item">Debian 13 base</span>
            <span class="dock-item">Open Source</span>
            <span class="dock-item" id="year">2026</span>
        </div>
    </footer>

    <script>
        // --- Slide viewer ---
        const slides = document.querySelectorAll(".slide");
        const dots = document.querySelectorAll(".seg-dot");
        const counterLabel = document.getElementById("windowCounter");
        const filenames = Array.from(slides).map(s => s.getAttribute("src"));

        let current = 0;
        let timer;

        function showSlide(index) {
            slides.forEach(s => s.classList.remove("active"));
            dots.forEach(d => { d.classList.remove("active"); d.setAttribute("aria-pressed", "false"); });

            slides[index].classList.add("active");
            dots[index].classList.add("active");
            dots[index].setAttribute("aria-pressed", "true");

            counterLabel.textContent = `${index + 1} / ${slides.length}`;
            current = index;
        }

        function nextSlide() {
            showSlide((current + 1) % slides.length);
        }

        function restartTimer() {
            clearInterval(timer);
            timer = setInterval(nextSlide, 4500);
        }

        dots.forEach((dot, i) => {
            dot.addEventListener("click", () => {
                showSlide(i);
                restartTimer();
            });
        });

        restartTimer();

        // --- Live clock in chrome bar ---
        const clockEl = document.getElementById("clock");

        function updateClock() {
            const now = new Date();
            const pad = n => String(n).padStart(2, "0");
            clockEl.textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
        }
        updateClock();
        setInterval(updateClock, 1000);

        // --- Typed terminal line ---
        const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        const typedEl = document.getElementById("typedLine");
        const fullText = "apt install persisos";

        if (reduceMotion) {
            typedEl.textContent = fullText;
        } else {
            let i = 0;
            (function typeChar() {
                typedEl.textContent = fullText.slice(0, i);
                i++;
                if (i <= fullText.length) {
                    setTimeout(typeChar, 55);
                }
            })();
        }

        // --- Footer year ---
        document.getElementById("year").textContent = `© ${new Date().getFullYear()}`;
    </script>

</body>

</html>
